<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smyths Scrape — Timeline</title>
<style>
  :root { --bg:#0b0e14; --card:#141925; --line:#222a3a; --txt:#e6edf3; --mut:#8b97a8; --accent:#4dd4ac; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:780px; margin:0 auto; padding:28px 20px 60px; }
  header { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:10px; }
  h1 { font-size:18px; font-weight:600; margin:0; letter-spacing:.3px; }
  a { color:var(--accent); text-decoration:none; }
  .mut { color:var(--mut); }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:22px; }
  ul { list-style:none; padding:0; margin:0; }
  li { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  li:last-child { border-bottom:0; }
  .dot { flex:0 0 10px; width:10px; height:10px; border-radius:50%; margin-top:6px; }
  .when { flex:0 0 110px; color:var(--mut); font-size:13px; font-variant-numeric:tabular-nums; }
  .ti { font-weight:600; }
  .de { color:var(--mut); font-size:13px; }
  footer { margin-top:36px; color:var(--mut); font-size:13px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛒 Smyths Toys — Timeline</h1>
    <div class="mut"><a href="index.html">← live progress</a> · <a href="how.html">how it works →</a></div>
  </header>
  <div class="panel"><ul id="timeline"><li class="mut">loading…</li></ul></div>
  <footer>auto-refreshes every 60s · times in Copenhagen · <a href="index.html">← back to live progress</a></footer>
</div>
<script>
const TZ='Europe/Copenhagen';
const TYPE_COLOR = { block:'#f2746b', fix:'#4dd4ac', scale:'#3aa6ff', milestone:'#f2b441', heartbeat:'#3fb950', tick:'#5a6577', note:'#8b97a8' };
const fmtFull = (t) => new Date(t).toLocaleString('en-GB',{timeZone:TZ,day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
async function load(){
  const events = await fetch('data/events.json?_='+Date.now()).then(r=>r.json()).catch(()=>[]);
  const html = events.slice().sort((a,b)=>b.t-a.t).map(e=>{
    const title = e.title ? `<span class="ti">${e.title}</span><br>` : '';
    return `<li><span class="dot" style="background:${TYPE_COLOR[e.type]||'#8b97a8'}"></span>
    <span class="when">${fmtFull(e.t)}</span>
    <span>${title}<span class="de">${e.detail||''}</span></span></li>`; }).join('');
  document.getElementById('timeline').innerHTML = html || '<li class="mut">no events yet</li>';
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
